name: Tarot tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/personalized-daily-tarot]

jobs:
  test-tarot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest "streamlit>=1.48.1" "requests>=2.31.0"
      - name: Run Tarot tests
        run: python -m pytest -q test_tarot_reading.py
